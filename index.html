<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Extractor</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1c1c1a; --muted:#77756e; --line:#e4e2db;
    --accent:#1d6b4f; --accent-ink:#fff; --soft:#e7f2ec; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131413; --card:#1c1d1b; --ink:#ecebe6; --muted:#9a988f; --line:#2c2d2a; --accent:#4fb58a; --accent-ink:#0b1a13; --soft:#1b2b24; --danger:#f2867e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
  h1{font-size:22px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--muted);margin:0 0 20px}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text],input[type=url]{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{margin:14px 0 0;color:var(--muted);min-height:22px}
  #status.err{color:var(--danger)}
  .tools{display:none;margin-top:18px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;gap:12px;flex-direction:column}
  .tools.on{display:flex}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{padding:5px 12px;border-radius:99px;font-size:13px}
  .chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
  label.opt{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
  .count{font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .thumb{position:relative;aspect-ratio:4/3;background:repeating-conic-gradient(#0000000d 0 25%,transparent 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .thumb input{position:absolute;top:10px;left:10px;width:20px;height:20px;accent-color:var(--accent)}
  .meta{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .tag{align-self:flex-start;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent)}
  .fname{font-size:12px;color:var(--muted);word-break:break-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .dim{font-size:12px;color:var(--muted)}
  .card button{padding:7px 10px;font-size:14px}
  .empty{padding:40px 0;text-align:center;color:var(--muted)}
  .note{margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gallery Extractor</h1>
  <p class="sub">Tempel link halaman, ambil semua gambarnya, lalu download satuan atau sekaligus dalam ZIP.</p>

  <form class="bar" id="form">
    <input type="url" id="url" placeholder="https://www.mgmotor.id/mgmodels/mgzshybrid" required autofocus>
    <button class="primary" id="go" type="submit">Ekstrak gambar</button>
  </form>
  <div id="status"></div>

  <section class="tools" id="tools">
    <div class="row">
      <span class="count" id="count"></span>
      <button id="all" type="button">Pilih semua</button>
      <button id="none" type="button">Kosongkan</button>
      <label class="opt"><input type="checkbox" id="hideIcons" checked> Sembunyikan ikon / logo / SVG</label>
    </div>
    <div class="row" id="chips"></div>
    <div class="row">
      <input type="text" id="prefix" placeholder="Awalan nama file, mis. mg-zs-hybrid" style="max-width:300px">
      <label class="opt"><input type="checkbox" id="origName"> Pakai nama asli file</label>
      <button class="primary" id="zip" type="button">Download terpilih (ZIP)</button>
    </div>
  </section>

  <div class="grid" id="grid"></div>
  <p class="note" id="note" hidden>Pastikan kamu berhak memakai gambar dari situs sumber. Gambar yang dimuat lewat JavaScript setelah klik/geser kadang tidak ikut terambil.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let pageUrl = "", items = [], activeSection = "semua";
const selected = new Set();
const dims = {};

const setStatus = (t, err) => { $("status").textContent = t; $("status").className = err ? "err" : ""; };
const proxy = (u, extra = "") => `/api/image?url=${encodeURIComponent(u)}&ref=${encodeURIComponent(pageUrl)}${extra}`;

function slug() {
  try {
    const last = new URL(pageUrl).pathname.split("/").filter(Boolean).pop() || new URL(pageUrl).hostname;
    return last.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  } catch { return "gambar"; }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const link = $("url").value.trim();
  if (!link) return;
  $("go").disabled = true;
  setStatus("Mengambil halaman…");
  $("grid").innerHTML = ""; $("tools").classList.remove("on");
  selected.clear(); activeSection = "semua";
  try {
    const r = await fetch("/api/extract?url=" + encodeURIComponent(link));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Gagal");
    pageUrl = data.page; items = data.images;
    $("prefix").value = slug();
    if (!items.length) { setStatus("Tidak ada gambar yang ditemukan di halaman ini. Kemungkinan gambarnya dimuat lewat JavaScript.", true); }
    else { setStatus(`Ditemukan ${items.length} gambar dari “${data.title || pageUrl}”.`); $("tools").classList.add("on"); $("note").hidden = false; }
    render();
  } catch (err) {
    setStatus("Gagal: " + err.message, true);
  } finally { $("go").disabled = false; }
});

function visible() {
  return items.filter((i) => (!$("hideIcons").checked || !i.isIcon) && (activeSection === "semua" || i.section === activeSection));
}

function renderChips() {
  const base = items.filter((i) => !$("hideIcons").checked || !i.isIcon);
  const counts = {};
  base.forEach((i) => (counts[i.section] = (counts[i.section] || 0) + 1));
  const box = $("chips"); box.innerHTML = "";
  const mk = (name, n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (activeSection === name ? " on" : "");
    b.textContent = `${name} (${n})`;
    b.onclick = () => { activeSection = name; render(); };
    box.appendChild(b);
  };
  mk("semua", base.length);
  Object.keys(counts).forEach((k) => mk(k, counts[k]));
}

function render() {
  renderChips();
  const list = visible();
  const grid = $("grid"); grid.innerHTML = "";
  if (items.length && !list.length) grid.innerHTML = '<div class="empty">Tidak ada gambar pada filter ini.</div>';
  list.forEach((it) => {
    const card = document.createElement("div");
    card.className = "card" + (selected.has(it.url) ? " sel" : "");

    const th = document.createElement("div"); th.className = "thumb";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = selected.has(it.url);
    const img = document.createElement("img");
    img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.alt = it.alt || it.file; img.src = it.url;
    let fell = false;
    img.onerror = () => { if (!fell) { fell = true; img.src = proxy(it.url); } };
    img.onload = () => { dims[it.url] = `${img.naturalWidth} × ${img.naturalHeight}`; dim.textContent = dims[it.url]; };
    const toggle = () => { cb.checked ? selected.add(it.url) : selected.delete(it.url); card.classList.toggle("sel", cb.checked); updateCount(); };
    cb.onchange = toggle;
    th.onclick = (e) => { if (e.target !== cb) { cb.checked = !cb.checked; toggle(); } };
    th.append(img, cb);

    const meta = document.createElement("div"); meta.className = "meta";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = it.section;
    const fn = document.createElement("div"); fn.className = "fname"; fn.textContent = it.alt || it.file; fn.title = it.file;
    const dim = document.createElement("div"); dim.className = "dim"; dim.textContent = dims[it.url] || it.ext.toUpperCase();
    const dl = document.createElement("button"); dl.type = "button"; dl.textContent = "Download"; dl.onclick = () => downloadOne(it, dl);
    meta.append(tag, fn, dim, dl);

    card.append(th, meta); grid.appendChild(card);
  });
  updateCount();
}

function updateCount() {
  const list = visible();
  const n = list.filter((i) => selected.has(i.url)).length;
  $("count").textContent = `${n} dipilih dari ${list.length}`;
  $("zip").disabled = selected.size === 0;
}

$("all").onclick = () => { visible().forEach((i) => selected.add(i.url)); render(); };
$("none").onclick = () => { selected.clear(); render(); };
$("hideIcons").onchange = render;

// ambil blob: coba langsung dulu, kalau diblokir lewat proxy server
async function getBlob(it) {
  try {
    const r = await fetch(it.url, { mode: "cors", referrerPolicy: "no-referrer" });
    if (r.ok) return await r.blob();
  } catch {}
  const r = await fetch(proxy(it.url));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "gagal");
  return await r.blob();
}

function save(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadOne(it, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = "…";
  try { save(await getBlob(it), it.file); }
  catch { window.open(it.url, "_blank", "noopener"); setStatus("Download otomatis gagal untuk satu file, dibuka di tab baru (klik kanan → simpan).", true); }
  finally { btn.disabled = false; btn.textContent = old; }
}

$("zip").onclick = async () => {
  const chosen = items.filter((i) => selected.has(i.url));
  if (!chosen.length) return;
  if (typeof JSZip === "undefined") { setStatus("Library ZIP gagal dimuat. Cek koneksi internet lalu muat ulang.", true); return; }
  $("zip").disabled = true;
  const zip = new JSZip(), prefix = ($("prefix").value.trim() || slug()), orig = $("origName").checked;
  const counters = {}, failed = [], used = new Set();
  let done = 0;
  for (const it of chosen) {
    setStatus(`Mengunduh ${++done} / ${chosen.length}…`);
    try {
      const blob = await getBlob(it);
      counters[it.section] = (counters[it.section] || 0) + 1;
      let name = orig ? it.file : `${prefix}-${it.section}-${String(counters[it.section]).padStart(2, "0")}.${it.ext || "png"}`;
      while (used.has(name)) name = "x-" + name;
      used.add(name); zip.file(name, blob);
    } catch { failed.push(it.file); }
  }
  if (done - failed.length > 0) {
    setStatus("Menyusun ZIP…");
    save(await zip.generateAsync({ type: "blob" }), `${prefix}.zip`);
  }
  setStatus(failed.length ? `Selesai. ${failed.length} file gagal diunduh (mungkin >4 MB atau diblokir): ${failed.join(", ")}` : `Selesai, ${chosen.length} gambar masuk ZIP.`, failed.length > 0);
  updateCount();
};
</script>
</body>
</html>
